          - Docker 指南: 02模型开发/02模型训练/mindspeed/mindspeed-llm/2.0.0/docker_guide.md
          - Qwen2.5-7B: 02模型开发/02模型训练/mindspeed/mindspeed-llm/2.0.0/qwen2.5-7B.md
          - Qwen3-14B: 02模型开发/02模型训练/mindspeed/mindspeed-llm/2.1.0/qwen3-14B.md
          - Qwen3-14B 开源数据集: 02模型开发/02模型训练/mindspeed/mindspeed-llm/2.1.0/qwen3-14B-开源数据集.md
          - Qwen3-14B 精度对齐: 02模型开发/02模型训练/mindspeed/mindspeed-llm/2.1.0/qwen3-14B精度对齐.md
          - Qwen3-14B 问题排查: 02模型开发/02模型训练/mindspeed/mindspeed-llm/2.1.0/qwen3-14B问题.md
        - MindSpeed-MM: 02模型开发/02模型训练/mindspeed/mindspeed-mm/mindspeed-mm.md
        - MindSpeed-RL:
          - 安装指南: 02模型开发/02模型训练/mindspeed/mindspeed-rl/install_guide.md
          - 实践: 02模型开发/02模型训练/mindspeed/mindspeed-rl/mindspeed-rl_practice.md
          - GRPO 算法: 02模型开发/02模型训练/mindspeed/mindspeed-rl/algorithms/grpo.md
          - GRPO YAML: 02模型开发/02模型训练/mindspeed/mindspeed-rl/features/grpo_yaml.md
          - 数据模块设计: 02模型开发/02模型训练/mindspeed/mindspeed-rl/features/data_module_design.md
          - integrated worker: 02模型开发/02模型训练/mindspeed/mindspeed-rl/features/integrated_worker.md
          - profiler: 02模型开发/02模型训练/mindspeed/mindspeed-rl/features/profiler.md
          - msprobe: 02模型开发/02模型训练/mindspeed/mindspeed-rl/features/msprobe.md
          - wandb/tensorboard 日志: 02模型开发/02模型训练/mindspeed/mindspeed-rl/features/logging_wandb_tensorboard.md
          - R1-Zero 7B: 02模型开发/02模型训练/mindspeed/mindspeed-rl/solutions/r1_zero_qwen25_7b.md
          - R1-Zero 32B: 02模型开发/02模型训练/mindspeed/mindspeed-rl/solutions/r1_zero_qwen25_32b.md
        - PTA: 02模型开发/02模型训练/mindspeed/pta/pta.md
        - Apex: 02模型开发/02模型训练/mindspeed/pta/apex.md
        - 模型迁移: 02模型开发/02模型训练/mindspeed/模型迁移.md
        - 精度对齐: 02模型开发/02模型训练/mindspeed/精度对齐.md
      - MindSpore:
        - 接入 MindSpeed: 02模型开发/02模型训练/mindspore/MindSpore接入MindSpeed.md
        - 并行: 02模型开发/02模型训练/mindspore/ms_并行.md
    - 模型评测: 02模型开发/03模型评测/RAEDME.md
    - 模型推理:
      - 推理总览: 02模型开发/04模型推理/RAEDME.md
      - MindIE:
        - 安装: 02模型开发/04模型推理/MindIE/README.md
        - 推理接口: 02模型开发/04模型推理/MindIE/MindIE推理接口.md
        - 性能调优: 02模型开发/04模型推理/MindIE/性能调优.md
      - BGE: 02模型开发/04模型推理/BGE.md
      - QWQ ATB-MindIE 版: 02模型开发/04模型推理/QWQ-ATB_MindIE版.md
      - QWQ MindSpore-MindIE 版: 02模型开发/04模型推理/QWQ-MindSpore_MindIE版.md
      - Qwen2-7B-Audio: 02模型开发/04模型推理/Qwen2-7B-Audio_ATB-MindIE.md
      - Qwen2.5-vl-7B: 02模型开发/04模型推理/Qwen2.5-vl-7B-MindIE.md
  - 论文:
    - 顶会: 31论文/顶会.md
  - 专项:
    - 超节点概述: 51专项/511超节点/超节点概述.md
    - 昇腾950: 51专项/511超节点/昇腾950/README.md

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.tilde

plugins:
  - same-dir
  - search:
      lang:
        - ja
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RunAtWorld/llm_book
