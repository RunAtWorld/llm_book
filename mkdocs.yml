site_name: LLM 大模型学习之旅
site_description: 围绕大语言模型（LLM）系统工程的学习笔记
site_url: https://runatworld.github.io/llm_book
repo_name: RunAtWorld/llm_book
repo_url: https://github.com/RunAtWorld/llm_book

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式

docs_dir: .
site_dir: site

exclude_docs: |
  .workbuddy/

nav:
