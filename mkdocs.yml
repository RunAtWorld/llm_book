site_name: LLM 大模型学习之旅
site_description: 围绕大语言模型（LLM）系统工程的学习笔记
site_url: https://runatworld.github.io/llm_book
repo_name: RunAtWorld/llm_book
repo_url: https://github.com/RunAtWorld/llm_book

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式

docs_dir: .
site_dir: site

nav:
  - 首页: README.md
  - 算力硬件:
    - NPU 总览: 03算力硬件/01_npu/README.md
    - 昇腾硬件架构: 03算力硬件/01_npu/昇腾硬件架构.md
    - CANN 知识: 03算力硬件/01_npu/cann/CANN知识.md
    - hccn_tool: 03算力硬件/01_npu/cann/hccn_tool.md
    - 驱动安装 (openEuler): 03算力硬件/01_npu/driver/install_driver_openEuler.md
    - 驱动安装 (910A Ubuntu): 03算力硬件/01_npu/install_910A_ubuntu20.04.md
    - NPU 上构建 Docker: 03算力硬件/01_npu/create_docker_on_npu.md
  - 数据工程:
    - numpy transpose 与 permute: 01数据工程/numpy/transpose和permute.md
  - 模型开发:
    - 基础知识:
      - Transformer 模型详解: 02模型开发/00基础知识/Transformer模型详解.md
      - Attention Is All You Need: 02模型开发/00基础知识/Attention Is All You Need.md
      - transformer: 02模型开发/00基础知识/transfomer.md
      - Flash Attention: 02模型开发/00基础知识/flash_attention.md
      - Norm: 02模型开发/00基础知识/Norm.md
      - 优化器: 02模型开发/00基础知识/优化器.md
      - 权重衰减: 02模型开发/00基础知识/ml基础/weight_deacy.md
      - LLM 中的上下文长度: 02模型开发/00基础知识/LLM中的上下文长度.md
      - MFU 计算公式: 02模型开发/00基础知识/大模型 MFU 计算公式.md
      - 线性度公式: 02模型开发/00基础知识/线性度公式.md
      - 注意力头: 02模型开发/00基础知识/注意力头.md
      - GRPO 原理: 02模型开发/00基础知识/grpo.md
    - 模型结构:
      - DeepSeek V3: 02模型开发/01模型结构/01LLM模型/deepseek/deepseek_v3.md
      - Qwen3: 02模型开发/01模型结构/01LLM模型/qwen/qwen3/qwen3.md
    - 模型训练:
      - 模型并行知识: 02模型开发/02模型训练/训练并行/模型并行知识.md
      - 内存计算: 02模型开发/02模型训练/内存计算.md
      - 固定随机性和确定性计算: 02模型开发/02模型训练/固定随机性和确定性计算.md
      - 数据 shuffle: 02模型开发/02模型训练/数据shuffle.md
      - FAQ: 02模型开发/02模型训练/FAQ.md
      - MindSpeed:
        - 总览: 02模型开发/02模型训练/mindspeed/README.md
        - MindSpeed-LLM:
